[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semsearch"
version = "0.1.0"
description = "Semantic search over a small technical FAQ: BM25, dense embeddings, and reciprocal rank fusion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alexandru Cojocari" }]
keywords = ["semantic-search", "bm25", "faiss", "embeddings", "information-retrieval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy==1.26.4",
    "rank-bm25==0.2.2",
    "faiss-cpu==1.15.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.3"]
dev = ["pytest>=8.0", "ruff>=0.8", "httpx>=0.27"]

[project.scripts]
semsearch = "semsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Query(), Depends(), and Body() in argument defaults.
"src/semsearch/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
